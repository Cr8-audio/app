name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    env:
      PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.cr8.audio
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CLOUDFLARE_ENV: preview
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: pnpm build

      - name: Clean wrangler cache
        run: rm -rf .wrangler

      - name: Deploy Preview with Audio Search
        if: env.YOUTUBE_API_KEY != ''
        id: deploy-with-audio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: 2f84630cfef8a6b13712d41a0e8d9afc
          command: deploy --config dist/server/wrangler.json --name crate-app-pr-${{ github.event.pull_request.number }} --domain ${{ env.PREVIEW_HOST }}

      # wrangler-action uploads its `secrets` input without forwarding the
      # deploy command's --config/--name flags. Bind the key explicitly so it
      # targets this PR Worker on the preview Cloudflare account.
      - name: Bind YouTube API Key
        if: env.YOUTUBE_API_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2f84630cfef8a6b13712d41a0e8d9afc
        run: printf '%s' "$YOUTUBE_API_KEY" | pnpm exec wrangler secret put YOUTUBE_API_KEY --env preview --name crate-app-pr-${{ github.event.pull_request.number }}

      - name: Deploy Preview without Audio Search
        if: env.YOUTUBE_API_KEY == ''
        id: deploy-without-audio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: 2f84630cfef8a6b13712d41a0e8d9afc
          command: deploy --config dist/server/wrangler.json --name crate-app-pr-${{ github.event.pull_request.number }} --domain ${{ env.PREVIEW_HOST }}

      - name: Warn about disabled preview audio search
        if: env.YOUTUBE_API_KEY == ''
        run: echo "::warning::YOUTUBE_API_KEY is not configured; the preview is live, but YouTube search returns 503 until the repository secret is added."

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://${process.env.PREVIEW_HOST}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🚀 Preview Deployment')
            );

            const body = `## 🚀 Preview Deployment

            **URL:** ${previewUrl}
            **Commit:** \`${context.payload.pull_request.head.sha.substring(0, 7)}\`
            **Updated:** ${new Date().toISOString()}

            > This preview will be automatically deleted when the PR is closed.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
